<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>UI Automation Demo Page</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 480px; margin: 40px auto; }
  h1 { font-size: 20px; }
  section { margin-bottom: 24px; padding: 12px; border: 1px solid #ddd; border-radius: 6px; }
  button { padding: 6px 12px; margin-left: 6px; cursor: pointer; }
</style>
<script src="../i18n/catalog.js"></script>
<script src="../i18n/apply.js"></script>
</head>
<body>
  <h1>UI Automation Demo Page</h1>

  <section>
    <h2>Trend Chart</h2>
    <style>
      /* Scoped to this section so the shared head styles stay untouched and
         a bug_chart_* mutant can copy the section wholesale. */
      #chart-wrap { position: relative; }
      #trend-chart { background: #fafafa; display: block; }
      #chart-tooltip { position: absolute; pointer-events: none; background: #333;
                       color: #fff; font-size: 12px; padding: 4px 8px;
                       border-radius: 4px; white-space: nowrap; }
      #chart-legend label { margin-right: 12px; font-size: 13px; }
    </style>
    <p><button id="chart-regenerate-btn" data-testid="chart-regenerate" data-i18n="chartRegenerate">Regenerate data</button></p>
    <div id="chart-wrap" data-testid="chart-wrap">
      <canvas id="trend-chart" data-testid="trend-chart" role="img" width="440" height="220"></canvas>
      <div id="chart-tooltip" data-testid="chart-tooltip" hidden></div>
    </div>
    <p id="chart-legend" data-testid="chart-legend"></p>
    <!-- Test contract: canvas pixels are opaque to locators, so the chart
         mirrors every plotted point into this hidden list. `data-series`,
         `data-index`, `data-value` carry the datum and `data-px`/`data-py`
         its CSS-pixel canvas position. Like `data-value` on the dashboard
         bars, these MUST survive any chart re-implementation —
         tests/test_chart.py asserts against them. -->
    <ul id="chart-data" data-testid="chart-data" hidden></ul>
  </section>

  <script>
    // Trend chart: multi-series line chart on <canvas>, with a DOM tooltip.
    // Kept in its own script block (like the multi-window block above) so the
    // frozen mutants under web/bugs/ never overlap it.
    const chartCanvas = document.getElementById('trend-chart');
    const chartCtx = chartCanvas.getContext('2d');
    const chartTooltip = document.getElementById('chart-tooltip');
    const chartLegend = document.getElementById('chart-legend');
    const chartDataMirror = document.getElementById('chart-data');

    // Catalog keys double as locale-independent series ids: they go into the
    // data-series attributes, while window.I18N maps them to display labels.
    const CHART_SERIES = [
      { key: 'chartSeriesVisits', color: '#2f6fdd', min: 100, max: 200 },
      { key: 'chartSeriesSales',  color: '#2fa84f', min: 40,  max: 100 },
      { key: 'chartSeriesErrors', color: '#d9534f', min: 0,   max: 30 }
    ];
    const CHART_POINTS = 12;
    const CHART_W = 440, CHART_H = 220;  // CSS pixels; backing store is dpr-scaled
    const PLOT = { left: 36, right: 428, top: 12, bottom: 192 };
    const CHART_Y_MAX = 220;             // fixed scale: every series range fits
    const HIT_RADIUS = 0;                // BUG: zero hit radius -- mousemove never captures a point

    // Deterministic PRNG (mulberry32): seed 42 reproduces the same first
    // dataset on every load, and Regenerate advances the seed.
    function mulberry32(seed) {
      return function () {
        seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function generateChartData(seed) {
      const rand = mulberry32(seed);
      return CHART_SERIES.map((series) =>
        Array.from({ length: CHART_POINTS }, () =>
          Math.round(series.min + rand() * (series.max - series.min))));
    }

    let chartSeed = 42;
    let chartGeneration = 1;
    let chartValues = generateChartData(chartSeed);

    function pointX(index) {
      return PLOT.left + (index * (PLOT.right - PLOT.left)) / (CHART_POINTS - 1);
    }
    function pointY(value) {
      return PLOT.bottom - (value / CHART_Y_MAX) * (PLOT.bottom - PLOT.top);
    }
    function visibleSeriesKeys() {
      return Array.from(chartLegend.querySelectorAll('input:checked'),
                        (el) => el.dataset.series);
    }

    function hideChartTooltip() {
      // Clear the data-* attributes along with hiding: a stale attribute on
      // a hidden tooltip could otherwise satisfy an attribute assertion.
      chartTooltip.hidden = true;
      chartTooltip.removeAttribute('data-series');
      chartTooltip.removeAttribute('data-index');
      chartTooltip.removeAttribute('data-value');
    }

    function showChartTooltip(seriesKey, index, value, x, y) {
      chartTooltip.textContent = `${window.I18N[seriesKey]} · ${index + 1}: ${value}`;
      chartTooltip.setAttribute('data-series', seriesKey);
      chartTooltip.setAttribute('data-index', String(index));
      chartTooltip.setAttribute('data-value', String(value));
      chartTooltip.style.left = `${x + 10}px`;
      chartTooltip.style.top = `${y - 28}px`;
      chartTooltip.hidden = false;
    }

    function drawChart() {
      hideChartTooltip();
      const dpr = window.devicePixelRatio || 1;
      chartCanvas.width = CHART_W * dpr;
      chartCanvas.height = CHART_H * dpr;
      chartCanvas.style.width = CHART_W + 'px';
      chartCanvas.style.height = CHART_H + 'px';
      chartCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      chartCtx.clearRect(0, 0, CHART_W, CHART_H);

      // Gridlines with y-axis value labels, plus x-axis point numbers.
      chartCtx.strokeStyle = '#ccc';
      chartCtx.lineWidth = 1;
      chartCtx.fillStyle = '#888';
      chartCtx.font = '10px Arial';
      chartCtx.textAlign = 'right';
      for (let value = 0; value <= CHART_Y_MAX; value += 55) {
        const y = pointY(value);
        chartCtx.beginPath();
        chartCtx.moveTo(PLOT.left, y);
        chartCtx.lineTo(PLOT.right, y);
        chartCtx.stroke();
        chartCtx.fillText(String(value), PLOT.left - 6, y + 3);
      }
      chartCtx.textAlign = 'center';
      for (let i = 0; i < CHART_POINTS; i += 1) {
        chartCtx.fillText(String(i + 1), pointX(i), PLOT.bottom + 14);
      }

      // One polyline + point dots per legend-enabled series.
      const visible = visibleSeriesKeys();
      CHART_SERIES.forEach((series, s) => {
        if (!visible.includes(series.key)) return;
        chartCtx.strokeStyle = series.color;
        chartCtx.fillStyle = series.color;
        chartCtx.lineWidth = 2;
        chartCtx.beginPath();
        chartValues[s].forEach((value, i) => {
          if (i === 0) chartCtx.moveTo(pointX(i), pointY(value));
          else chartCtx.lineTo(pointX(i), pointY(value));
        });
        chartCtx.stroke();
        chartValues[s].forEach((value, i) => {
          chartCtx.beginPath();
          chartCtx.arc(pointX(i), pointY(value), 3, 0, Math.PI * 2);
          chartCtx.fill();
        });
      });

      chartCanvas.setAttribute('aria-label', window.I18N.chartTrend);
      chartCanvas.setAttribute('data-series-count', String(visible.length));
      chartCanvas.setAttribute('data-generation', String(chartGeneration));

      // Rewrite the data mirror last: every series (toggled-off ones too, so
      // tests can still read their coordinates), one node per point.
      chartDataMirror.textContent = '';
      CHART_SERIES.forEach((series, s) => {
        chartValues[s].forEach((value, i) => {
          const li = document.createElement('li');
          li.setAttribute('data-testid', 'chart-point');
          li.setAttribute('data-series', series.key);
          li.setAttribute('data-index', String(i));
          li.setAttribute('data-value', String(value));
          li.setAttribute('data-px', String(Math.round(pointX(i))));
          li.setAttribute('data-py', String(Math.round(pointY(value))));
          chartDataMirror.appendChild(li);
        });
      });
    }

    chartCanvas.addEventListener('mousemove', (event) => {
      const rect = chartCanvas.getBoundingClientRect();
      const mx = (event.clientX - rect.left) * (CHART_W / rect.width);
      const my = (event.clientY - rect.top) * (CHART_H / rect.height);
      const visible = visibleSeriesKeys();
      let best = null;
      CHART_SERIES.forEach((series, s) => {
        if (!visible.includes(series.key)) return;
        chartValues[s].forEach((value, i) => {
          const dx = pointX(i) - mx;
          const dy = pointY(value) - my;
          const dist2 = dx * dx + dy * dy;
          if (dist2 <= HIT_RADIUS * HIT_RADIUS && (best === null || dist2 < best.dist2)) {
            best = { key: series.key, index: i, value: value,
                     x: pointX(i), y: pointY(value), dist2: dist2 };
          }
        });
      });
      if (best) showChartTooltip(best.key, best.index, best.value, best.x, best.y);
      else hideChartTooltip();
    });

    chartCanvas.addEventListener('mouseleave', hideChartTooltip);

    CHART_SERIES.forEach((series) => {
      const label = document.createElement('label');
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = true;
      checkbox.setAttribute('data-series', series.key);
      checkbox.addEventListener('change', drawChart);
      const name = document.createElement('span');
      name.textContent = window.I18N[series.key];
      name.style.color = series.color;
      label.appendChild(checkbox);
      label.appendChild(document.createTextNode(' '));
      label.appendChild(name);
      chartLegend.appendChild(label);
    });

    document.getElementById('chart-regenerate-btn').addEventListener('click', () => {
      chartSeed += 1;
      chartGeneration += 1;
      chartValues = generateChartData(chartSeed);
      drawChart();
    });

    drawChart();
  </script>
</body>
</html>
