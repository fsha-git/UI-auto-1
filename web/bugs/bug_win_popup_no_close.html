<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>UI Automation Demo Page</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 480px; margin: 40px auto; }
  h1 { font-size: 20px; }
  section { margin-bottom: 24px; padding: 12px; border: 1px solid #ddd; border-radius: 6px; }
  button { padding: 6px 12px; margin-left: 6px; cursor: pointer; }
</style>
<script src="../i18n/catalog.js"></script>
<script src="../i18n/apply.js"></script>
</head>
<body>
  <h1>UI Automation Demo Page</h1>

  <section>
    <h2>Windows &amp; Tabs</h2>
    <p>
      <a href="../profile.html" target="_blank" rel="noopener" data-testid="profile-link" data-i18n="openProfile">Open profile</a>
      <button id="open-popup-btn" data-testid="open-popup" data-i18n="openPopup">Quick note</button>
    </p>
    <p id="popup-result" data-testid="popup-result"></p>
  </section>

  <script>
    let quickNotePopup = null;

    document.getElementById('open-popup-btn').addEventListener('click', () => {
      // Opens the companion mutant popup (win_popup_no_close.html) instead of
      // ../popup.html; the injected defect lives in that page.
      quickNotePopup = window.open('win_popup_no_close.html', 'quick-note', 'width=360,height=320');
    });

    window.addEventListener('message', (event) => {
      if (event.origin !== window.location.origin) return;
      if (quickNotePopup === null || event.source !== quickNotePopup) return;
      if (event.data && event.data.type === 'quick-note') {
        document.getElementById('popup-result').textContent = event.data.text;
      }
    });
  </script>
</body>
</html>
