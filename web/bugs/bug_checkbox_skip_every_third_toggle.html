<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>UI Automation Demo Page</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 480px; margin: 40px auto; }
  h1 { font-size: 20px; }
  section { margin-bottom: 24px; padding: 12px; border: 1px solid #ddd; border-radius: 6px; }
  input[type="text"] { padding: 6px; }
  button { padding: 6px 12px; margin-left: 6px; cursor: pointer; }
  #todo-list li { padding: 2px 0; }
</style>
</head>
<body>
  <h1>UI Automation Demo Page</h1>

  <section>
    <h2>To-Do List</h2>
    <input type="text" id="todo-input" data-testid="todo-input" placeholder="Enter a task">
    <button id="add-btn" data-testid="add-todo">Add</button>
    <ul id="todo-list" data-testid="todo-list"></ul>
  </section>

  <section>
    <h2>Status Toggle</h2>
    <label>
      <input type="checkbox" id="status-checkbox" data-testid="status-checkbox">
      Enable feature
    </label>
    <p id="status-label" data-testid="status-label">Status: OFF</p>
  </section>

  <section>
    <h2>Counter</h2>
    <button id="counter-btn" data-testid="counter-increment">Click me</button>
    <span id="counter" data-testid="counter-value">0</span>
  </section>

  <script>
    const todoInput = document.getElementById('todo-input');
    const addBtn = document.getElementById('add-btn');
    const todoList = document.getElementById('todo-list');

    addBtn.addEventListener('click', () => {
      const text = todoInput.value.trim();
      if (!text) return;
      const li = document.createElement('li');
      li.textContent = text;
      todoList.appendChild(li);
      todoInput.value = '';
    });

    const statusCheckbox = document.getElementById('status-checkbox');
    const statusLabel = document.getElementById('status-label');

    // BUG: a stray "optimization" skips the label refresh on every 3rd change
    // event, so the label silently goes stale under repeated toggling even
    // though a single click still looks correct.
    let changeCount = 0;
    statusCheckbox.addEventListener('change', () => {
      changeCount += 1;
      if (changeCount % 3 === 0) return;
      statusLabel.textContent = `Status: ${statusCheckbox.checked ? 'ON' : 'OFF'}`;
    });

    const counterBtn = document.getElementById('counter-btn');
    const counter = document.getElementById('counter');
    let count = 0;

    counterBtn.addEventListener('click', () => {
      count += 1;
      counter.textContent = String(count);
    });
  </script>
</body>
</html>
