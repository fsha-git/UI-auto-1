[pytest]
testpaths = tests
addopts = -v --tracing=retain-on-failure --screenshot=only-on-failure --video=retain-on-failure --reruns 2 --reruns-delay 1 --cov=server --cov=pages --cov-report=term-missing --cov-report=html:reports/coverage-py
# pytest-timeout is a hang-guard of last resort, NOT a latency assertion. It must
# stay comfortably above Playwright's expect() retry window (5s, set in
# conftest.py) plus context setup / navigation / JS-coverage collection —
# otherwise a retrying assertion gets killed before it can ever succeed.
timeout = 60
markers =
    perf: front-end performance guardrails (deselect with -m "not perf")
